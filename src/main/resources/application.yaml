server:
  port: 8085
spring:
  application:
    name: redis-demo
  datasource:
    url: jdbc:h2:mem:appdb
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
  cache:
    type: redis
    cache-names: weather
  data:
    redis:
      host: localhost
      port: 6379
